[project]
name = "canvas-action-training"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mlx-lm[train]==0.31.3",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
voice = [
    "parakeet-mlx==0.5.2",
]

[dependency-groups]
dev = ["ruff==0.16.9"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
